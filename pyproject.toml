[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-citas-demo"
version = "1.0.0"
description = "Demostrador seguro de automatizacion de solicitudes y citas web"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Hector Samir Montenegro Villalobos" }
]
dependencies = [
  "Flask>=3.1,<4",
  "mysql-connector-python>=9,<10",
  "python-dotenv>=1,<2",
  "selenium>=4.27,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "bandit>=1.8,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106"]

[tool.bandit]
exclude_dirs = ["tests"]
